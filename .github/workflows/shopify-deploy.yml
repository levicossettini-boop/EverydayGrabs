name: Deploy Shopify theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Verify Shopify CLI
        run: shopify version

      - name: Push theme to Shopify
        working-directory: ./Shopify theme.md
        env:
          SHOPIFY_CLI_AUTH_TOKEN: ${{ secrets.SHOPIFY_API_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE_URL }}
        run: |
          shopify theme push --path=. --themeid="${{ secrets.SHOPIFY_THEME_ID }}" --allow-live
